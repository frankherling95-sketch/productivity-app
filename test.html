<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<title>Herling Analytics — Smoke test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:grid;grid-template-rows:auto 1fr;height:100vh}
  .results{padding:16px 20px;background:#f7f6f3;border-bottom:1px solid #ddd;overflow:auto;max-height:240px}
  .results h1{margin:0 0 10px;font-size:16px}
  .check{padding:3px 0;font-family:monospace;font-size:13px}
  .check.ok{color:#2f9e44}
  .check.fail{color:#c92a2a}
  .check.warn{color:#e67700}
  .summary{margin-top:8px;padding:8px;border-radius:6px;font-weight:600}
  .summary.allgreen{background:#d3f9d8;color:#2b8a3e}
  .summary.hasfail{background:#ffe3e3;color:#c92a2a}
  iframe{width:100%;height:100%;border:none;background:#fff}
</style>
</head>
<body>
<div class="results">
  <h1>🧪 Smoke test — index.html</h1>
  <div id="checks"><div class="check">Loading app…</div></div>
  <div id="summary"></div>
</div>
<iframe id="app" src="index.html"></iframe>
<script>
const checks = document.getElementById('checks');
const summary = document.getElementById('summary');
const errors = [];
window.addEventListener('error', e => errors.push(e.message));
window.addEventListener('unhandledrejection', e => errors.push('Promise: ' + (e.reason?.message || e.reason)));

const iframe = document.getElementById('app');
const iframeErrors = [];
let gedraaid = false;

/* ── Dit bestand heeft een server nodig ──
   Via file:// is elk document een eigen origin, dus iframe.contentWindow
   is afgeschermd en elke test zou op een SecurityError stuklopen. Eerder
   bleef het scherm dan stil op "Loading app…" staan zonder te zeggen
   waarom. Nu zegt het wat je moet doen. */
function meldServerNodig(reden) {
  gedraaid = true;
  checks.innerHTML =
    '<div class="check fail">✗ ' + reden + '</div>' +
    '<div class="check">Deze test heeft een lokale webserver nodig. Start er een in de projectmap:</div>' +
    '<div class="check" style="user-select:all;background:#fff;padding:6px 8px;border-radius:4px;margin:6px 0">' +
    'npx --yes http-server . -p 8765 -c-1 --silent</div>' +
    '<div class="check">Open daarna <a href="http://localhost:8765/test.html">http://localhost:8765/test.html</a></div>';
  summary.className = 'summary hasfail';
  summary.textContent = 'Niet gedraaid — server nodig';
}

if (location.protocol === 'file:') {
  meldServerNodig('Geopend via file:// — de browser schermt de iframe dan af.');
} else {
  iframe.addEventListener('load', () => {
    try {
      iframe.contentWindow.addEventListener('error', e => iframeErrors.push(e.message));
    } catch (e) {
      meldServerNodig('Geen toegang tot de iframe: ' + e.message);
      return;
    }
    /* Wait a beat for boot to finish (loadGist is async) */
    setTimeout(runChecks, 1500);
  });
  /* Vangnet: blijft het om welke reden dan ook hangen, zeg dat dan ook. */
  setTimeout(() => {
    if (!gedraaid) meldServerNodig('De app in de iframe reageerde niet binnen 10 seconden.');
  }, 10000);
}

/* ── Bouwstenen voor de sync-tests ──
   Eén vaste state: map 'Klanten' met twee pagina's, plus twee checklist-
   items, drie urenregels, één factuur en twee klanten. Samen 11 items voor
   stateOmvang (die telt de map mee) en 2 notities voor versieTelling (die
   telt alleen pagina's). Elke aanroep geeft een verse kopie, zodat een test
   die muteert de volgende niet beïnvloedt. */
function mkState() {
  return {
    notes:{tree:[{id:'n1',type:'folder',title:'Klanten',children:[
      {id:'n2',type:'page',title:'Acme',content:'x'.repeat(900),children:[]},
      {id:'n3',type:'page',title:'Verdwenen notitie',content:'yyyy',children:[]}
    ]}]},
    checklist:{items:[{id:'c1'},{id:'c2'}]},
    uren:{entries:[{id:'u1'},{id:'u2'},{id:'u3'}]},
    facturen:{invoices:[{id:'f1'}]},
    tasks:{clients:[{id:'k1'},{id:'k2'}]}
  };
}
/* Dezelfde state, maar één notitie is verdwenen — het scenario van 20-8. */
function zonderNotitie() {
  const s = mkState();
  s.notes.tree[0].children = s.notes.tree[0].children.filter(n => n.id !== 'n3');
  return s;
}
/* Notitie bestaat nog, maar de tekst is grotendeels weg. */
function metKorteTekst() {
  const s = mkState();
  vindNotitie(s, 'n2').content = 'xx';
  return s;
}
function vindNotitie(state, id) {
  const zoek = nodes => {
    for (const n of nodes || []) {
      if (n.id === id) return n;
      const t = zoek(n.children);
      if (t) return t;
    }
    return null;
  };
  return zoek((state.notes || {}).tree);
}

function runChecks() {
  gedraaid = true;
  let w, d;
  try {
    w = iframe.contentWindow;
    d = w.document;
    if (!d) throw new Error('geen document');
  } catch (e) {
    meldServerNodig('Geen toegang tot de iframe: ' + e.message);
    return;
  }
  const tests = [
    ['Module: Dashboard exists',           () => !!d.getElementById('mod-dashboard')],
    ['Module: Todo exists',                () => !!d.getElementById('mod-todo')],
    ['Module: Notes exists',               () => !!d.getElementById('mod-notes')],
    ['Module: Checklist exists',           () => !!d.getElementById('mod-checklist')],
    ['Module: Agenda is weg',              () => !d.getElementById('mod-agenda')],
    ['Nav: geen agenda-item meer',         () => !d.querySelector('[data-mod="agenda"]')],
    /* Niet via w.rawState: dat is een top-level `let` en die staat niet op
       window, dus deze drie stonden altijd op rood en zeiden niets. Via de
       snapshot-functie kunnen we de state wél bereiken — en meteen
       controleren dat de modules erin zitten in plaats van alleen dat er
       een naam bestaat. */
    ['State: bereikbaar via snapshot',     () => !!w.huidigeStateSnapshot()],
    ['State: kanban in de state',          () => typeof w.huidigeStateSnapshot().tasks === 'object'],
    ['State: checklist in de state',       () => typeof w.huidigeStateSnapshot().checklist === 'object'],
    ['State: notities in de state',        () => Array.isArray((w.huidigeStateSnapshot().notes||{}).tree)],
    ['Function: saveGist defined',         () => typeof w.saveGist === 'function'],
    ['Function: scheduleSave defined',     () => typeof w.scheduleSave === 'function'],
    ['Function: saveLocalBackup defined',  () => typeof w.saveLocalBackup === 'function'],
    ['Function: switchModule defined',     () => typeof w.switchModule === 'function'],
    ['Function: renderChecklistModule',    () => typeof w.renderChecklistModule === 'function'],
    ['Sidebar logo present',               () => d.querySelector('.sidebar-logo,.sidebar img,svg[viewBox]')],
    ['localStorage backup writable',       () => { try{ w.localStorage.setItem('test_smoke','1'); w.localStorage.removeItem('test_smoke'); return true }catch(e){return false} }],

    /* ── Sync- en herstellogica ──
       Dit is sinds 2026-08-21 het gevaarlijkste stuk van de app: hier kan
       een fout stilletjes data wissen. Het is puur functioneel (state in,
       state uit, geen netwerk), dus het hoort hier getest te worden en niet
       met de hand in de console. */
    ['Sync: functies aanwezig',            () => ['stateOmvang','voegStateSamen','versieTelling',
                                                  'driveRevisies','driveRevisieState','openVersiesModal']
                                                  .every(f => typeof w[f] === 'function')],
    ['stateOmvang: onzin geeft 0',         () => [null, undefined, {}, 'tekst']
                                                  .every(x => w.stateOmvang(x) === 0)],
    ['stateOmvang: telt alle modules',     () => w.stateOmvang(mkState()) === 11],
    ['stateOmvang: leeg < 90% van vol',    () => w.stateOmvang({}) < Math.floor(w.stateOmvang(mkState())*0.9)],

    ['Merge: ontbrekende notitie komt terug', () => {
      const r = w.voegStateSamen(mkState(), zonderNotitie());
      return r.rapport.notities === 1 &&
             vindNotitie(r.state, 'n3') && vindNotitie(r.state, 'n3').content === 'yyyy';
    }],
    ['Merge: ingekorte tekst wordt hersteld', () => {
      const r = w.voegStateSamen(mkState(), metKorteTekst());
      return r.rapport.tekst === 1 && vindNotitie(r.state, 'n2').content.length === 900;
    }],
    ['Merge: langere tekst blijft staan',   () => {
      const nu = mkState();
      vindNotitie(nu, 'n2').content = 'z'.repeat(2000);
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.tekst === 0 && vindNotitie(r.state, 'n2').content.length === 2000;
    }],
    ['Merge: nieuwere uren blijven behouden', () => {
      const nu = mkState();
      nu.uren.entries.push({id:'u9'});
      const r = w.voegStateSamen(mkState(), nu);
      return r.state.uren.entries.length === 4 && r.rapport.uren === 0;
    }],
    ['Merge: ontbrekende factuur wordt aangevuld', () => {
      const nu = mkState();
      nu.facturen.invoices = [];
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.facturen === 1 && r.state.facturen.invoices.length === 1;
    }],
    ['Merge: raakt de invoer niet aan',     () => {
      const oud = mkState(), nu = zonderNotitie();
      const voor = JSON.stringify([oud, nu]);
      w.voegStateSamen(oud, nu);
      return JSON.stringify([oud, nu]) === voor;
    }],
    ['Merge: gelijke states geven leeg rapport', () => {
      const r = w.voegStateSamen(mkState(), mkState());
      return w.versieRapportTekst(r.rapport) === null;
    }],
    ['versieTelling: mappen tellen niet mee', () => {
      const t = w.versieTelling(mkState());
      return t.notities === 2 && t.uren === 3 && t.facturen === 1 && t.klanten === 2;
    }],

    /* ── Vastpinnen ──
       Twee eisen: vastgepind staat bovenaan, en onderling verandert er niets
       aan de volgorde. Beide tests zijn onafhankelijk van de gekozen
       sorteermodus, zodat ze niet omvallen door wat er in Drive staat. */
    ['Pin: vastgepind gaat voor de rest', () =>
      w.clVastCmp({pinned:true}, {}) < 0 &&
      w.clVastCmp({}, {pinned:true}) > 0 &&
      w.clVastCmp({pinned:true}, {pinned:true}) === 0 &&
      w.clVastCmp({}, {}) === 0],
    ['Pin: sortering zet vastgepind bovenaan', () => {
      const cmp = w.clSortCmp();
      const lijst = [
        {id:'a', text:'Aaa', createdAt:3, sortOrder:1, deadline:'2026-01-01'},
        {id:'b', text:'Zzz', createdAt:1, sortOrder:9, deadline:'2026-12-31', pinned:true},
        {id:'c', text:'Mmm', createdAt:2, sortOrder:5, deadline:'2026-06-15'}
      ];
      return lijst.slice().sort(cmp).map(i => i.id)[0] === 'b';
    }],
    ['Pin: onderling geldt de gewone volgorde', () => {
      const cmp = w.clSortCmp();
      const p1 = {id:'p1', text:'Alfa', createdAt:1, sortOrder:1, deadline:'2026-01-01'};
      const p2 = {id:'p2', text:'Beta', createdAt:2, sortOrder:2, deadline:'2026-02-01'};
      const zonder = Math.sign(cmp(p1, p2));
      const met    = Math.sign(cmp({...p1, pinned:true}, {...p2, pinned:true}));
      return zonder !== 0 && zonder === met;
    }],

    /* ── Anonimiseren ──
       De maskeerder draait op de echte klantenlijst uit de iframe, dus deze
       tests toetsen niet één vaste naam maar de eigenschap die telt: wat
       eruit komt is weer precies wat erin ging. Zijn er geen klanten, dan
       zeggen de eerste twee niets en worden ze overgeslagen. */
    ['Masker: functies aanwezig',          () => ['aiMaskerder','aiMaskerenAan','aiMaskerenWissel']
                                                  .every(f => typeof w[f] === 'function')],
    ['Masker: klantnaam gaat eruit en weer terug', () => {
      const klant = (w.huidigeStateSnapshot().tasks.clients || [])[0];
      if (!klant || !klant.name || klant.name.length < 3) return true;   /* niets te maskeren */
      const m = w.aiMaskerder();
      const zin = 'rapport voor ' + klant.name + ' afronden';
      const weg = m.maskeer(zin);
      return !weg.includes(klant.name) && /\{\{KLANT_\d\}\}/.test(weg) && m.ontmaskeer(weg) === zin;
    }],
    ['Masker: mail en telefoon gaan eruit', () => {
      const m = w.aiMaskerder();
      const zin = 'bel 06-12345678 of mail naar iemand@voorbeeld.nl';
      const weg = m.maskeer(zin);
      return !weg.includes('12345678') && !weg.includes('@') && m.ontmaskeer(weg) === zin;
    }],
    ['Masker: deelwoord blijft ongemoeid', () => {
      const m = w.aiMaskerder();
      /* Een token mag niet middenin een langer woord landen. */
      const zin = 'onbekendbedrijfplein 4 is geen klant';
      return m.maskeer(zin) === zin;
    }],
    ['Masker: slordig teruggeschreven token landt toch', () => {
      const klant = (w.huidigeStateSnapshot().tasks.clients || [])[0];
      if (!klant || !klant.name || klant.name.length < 3) return true;
      const m = w.aiMaskerder();
      m.maskeer(klant.name);
      const t = m.maskeer(klant.name).match(/\{\{(KLANT_\d)\}\}/)[1];
      return m.ontmaskeer('bij {{ ' + t + ' }} gedaan') === 'bij ' + klant.name + ' gedaan' &&
             m.ontmaskeer('bij ' + t + ' gedaan')       === 'bij ' + klant.name + ' gedaan';
    }],
    ['Masker: JSON-antwoord wordt diep terugvertaald', () => {
      const m = w.aiMaskerder();
      const weg = m.maskeer('mail naar iemand@voorbeeld.nl');
      const uit = m.ontmaskeerDiep({ a:[{ b:weg }], c:{ [weg]:null }, d:false });
      return uit.a[0].b === 'mail naar iemand@voorbeeld.nl' &&
             Object.keys(uit.c)[0] === 'mail naar iemand@voorbeeld.nl' &&
             uit.c[Object.keys(uit.c)[0]] === null && uit.d === false;
    }],
    ['Masker: stroom lijmt een gebroken token', () => {
      /* Het echte risico bij de wekelijkse review: {{KLA + NT_1}} over twee
         chunks. In stukjes van 3 tekens breekt elk token gegarandeerd. */
      const m = w.aiMaskerder();
      const zin = 'mail naar iemand@voorbeeld.nl en bel 06-12345678';
      const weg = m.maskeer(zin);
      const s = m.stroom();
      let uit = '';
      for (let i = 0; i < weg.length; i += 3) uit += s.duw(weg.slice(i, i + 3));
      uit += s.slot();
      return uit === zin;
    }],

    /* ── Model kiezen en het antwoord uitlezen ──
       Twee keer op rij lag de scanner stil door iets wat niets met de
       factuur te maken had: eerst een alias die naar het duurste model wees,
       daarna een vaste naam die Google introk. Wat hier getest wordt is de
       weg terug: herkennen dát een model weg is, de opvolger kiezen, en het
       antwoord van een dénkend model goed uitlezen. Geen van deze tests
       belt de API. */
    ['Model: functies aanwezig',           () => ['geminiModel','geminiZetModel','geminiIsDrie',
                                                  'geminiFlashModellen','geminiHaalModellen',
                                                  '_geminiVolgendModel','_geminiModelWeg','_geminiUrl',
                                                  '_geminiTekst','_geminiJson','_geminiLeegUitleg']
                                                  .every(f => typeof w[f] === 'function')],
    ['Model: geen "-latest" als standaard', () => {
      /* Een alias volgt het nieuwste model, en juist dat heeft de krapste
         gratis laag. Het plafond mag niet veranderen zonder dat je iets doet. */
      const nu = w.geminiModel();
      return typeof nu === 'string' && nu.length > 0 && !/latest/.test(nu);
    }],
    ['Model: oudste Flash eerst, 3.10 ná 3.8', () => {
      const uit = w.geminiFlashModellen(['gemini-3.8-flash','gemini-3.10-flash',
        'gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3.1-flash-image','embedding-001']);
      return uit.join(',') === 'gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.8-flash,gemini-3.10-flash';
    }],
    ['Model: ingetrokken model wordt als zodanig herkend', () =>
      w._geminiModelWeg(400, 'This model models/gemini-2.5-flash is no longer available to new users.') === true &&
      w._geminiModelWeg(404, 'models/gemini-x is not found for API version v1beta') === true &&
      /* Een limiet of een kapotte sleutel is iets heel anders en mag geen
         modelwissel uitlokken. */
      w._geminiModelWeg(429, 'You exceeded your current quota') === false &&
      w._geminiModelWeg(400, 'API key not valid. Please pass a valid API key.') === false],
    ['Model: de sleutel staat in de query, niet in het pad', () => {
      const u = w._geminiUrl('gemini-3.5-flash', 'generateContent', '');
      return /\/v1beta\/models\/gemini-3\.5-flash:generateContent\?/.test(u) && /[?&]key=/.test(u);
    }],
    ['Antwoord: het denkdeel telt niet mee', () =>
      /* Gemini 3 zet zijn samenvatting als eigen part met thought:true vóór
         het antwoord. parts[0] pakken levert dan het denkwerk op. */
      w._geminiTekst({candidates:[{content:{parts:[
        {text:'even nadenken', thought:true},{text:'{"a":1}'}]}}]}) === '{"a":1}' &&
      w._geminiTekst({candidates:[{content:{parts:[{text:'{"a":'},{text:'1}'}]}}]}) === '{"a":1}'],
    ['Antwoord: JSON in een codehek wordt gelezen', () =>
      w._geminiJson('{"b":2}').b === 2 &&
      w._geminiJson('```json\n{"a":1}\n```').a === 1 &&
      w._geminiJson('Hier is het:\n{"c":3}\nklaar').c === 3],
    ['Antwoord: leeg antwoord noemt de reden', () =>
      /paste niet/.test(w._geminiLeegUitleg({candidates:[{finishReason:'MAX_TOKENS'}]})) &&
      /tegen/.test(w._geminiLeegUitleg({candidates:[{finishReason:'SAFETY'}]}))],

    /* ── Facturen inscannen: de wachtrij ──
       Wat hier getest kan worden zonder de API te bellen is de rand: het
       bestandsveld accepteert een stapel, en een te groot bestand krijgt
       zijn eigen foutregel in plaats van de hele stapel af te breken. Die
       laatste test kiest bewust alleen te grote bestanden, dan gaat er
       gegarandeerd geen verzoek de deur uit. */
    ['Scan: veld accepteert meerdere bestanden', () =>
      !!d.getElementById('facScanInput') && d.getElementById('facScanInput').multiple === true],
    ['Scan: wachtrij-functies aanwezig',   () => ['facScanStart','facScanVolgende','facScanOversla',
                                                  'facScanHerkans','facScanLeeg','facScanBezig']
                                                  .every(f => typeof w[f] === 'function')],
    ['Scan: stapel opent de modaal met een teller', () => {
      const nep = n => ({ name:n, size:20*1024*1024, type:'application/pdf' });
      try {
        w.facScanStart([nep('een.pdf'), nep('twee.pdf'), nep('drie.pdf')]);
        return w.facScanBezig() === true &&
               d.getElementById('facOudModal').classList.contains('open') &&
               /1 van 3/.test(d.getElementById('facOudTitel').textContent) &&
               d.getElementById('facOudOverslaBtn').style.display !== 'none' &&
               d.getElementById('facOudOpslaanBtn').textContent === 'Opslaan en volgende';
      } finally { w.closeFacOud(); }
    }],
    ['Scan: sluiten ruimt de wachtrij op', () => w.facScanBezig() === false],
    ['Scan: mime volgt de extensie als het type ontbreekt', () =>
      /* Een PDF uit Drive komt binnen als octet-stream en een foto soms
         zonder type. Stond er dan "application/pdf" op een JPG, dan kwam er
         een 400 terug die naar de factuur leek te wijzen. */
      w.facScanMime({name:'F000069.pdf', type:''}) === 'application/pdf' &&
      w.facScanMime({name:'foto.JPG', type:'application/octet-stream'}) === 'image/jpeg' &&
      w.facScanMime({name:'scan.heic', type:'image/heic'}) === 'image/heic' &&
      w.facScanMime({name:'plaatje.gif', type:'image/gif'}) === ''],
    ['Scan: bedrag in Nederlandse notatie komt goed aan', () =>
      /* Er wordt om een getal gevraagd, maar bij een Nederlandse factuur
         komt er geregeld tekst terug. Number() maakte daar NaN van en dan
         bleef juist het bedrag leeg. */
      w.facScanBedrag(1234.5) === 1234.5 &&
      w.facScanBedrag('1.234,56') === 1234.56 &&
      w.facScanBedrag('€ 1.234,56') === 1234.56 &&
      w.facScanBedrag('1,234.56') === 1234.56 &&
      w.facScanBedrag('12,50') === 12.5 &&
      w.facScanBedrag('1.234') === 1234 &&
      w.facScanBedrag('') === 0 && w.facScanBedrag(null) === 0 && w.facScanBedrag('n.v.t.') === 0],
    ['Scan: datum ook in de Nederlandse volgorde', () =>
      w.facScanDatum('2026-03-31') === '2026-03-31' &&
      w.facScanDatum('31-03-2026') === '2026-03-31' &&
      w.facScanDatum('1/3/2026') === '2026-03-01' &&
      w.facScanDatum('maart 2026') === '' && w.facScanDatum('') === '' &&
      w.facScanDatum('2026-13-01') === ''],
    ['Scan: onleesbaar bestandstype gaat niet de deur uit', () => {
      /* Alle bestanden in deze stapel zijn ongeschikt, dus er kan gegarandeerd
         geen verzoek uitgaan -- de melding komt uit de app zelf. */
      try {
        w.facScanStart([{ name:'plaatje.gif', size:1024, type:'image/gif' }]);
        return /kan niet gelezen worden/.test(d.getElementById('facOudBody').textContent);
      } finally { w.closeFacOud(); }
    }],

    /* ── Inleeslogboek ──
       De vingerafdruk gaat over de inhoud, niet over de naam: dat is de hele
       reden dat de app een hernoemde PDF herkent. */
    ['Log: scanLog bestaat in de state', () => {
      /* scanLog wordt gezet door hydrateerState(), en die draait pas na het
         inloggen. In een verse browser staat de test dus op het loginscherm
         en zegt hij niets -- dan overslaan in plaats van eeuwig op rood. */
      if (d.getElementById('appScreen').style.display === 'none') return true;
      return Array.isArray(w.huidigeStateSnapshot().facturen.scanLog);
    }],
    ['Log: functies aanwezig',             () => ['facScanVingerafdruk','facLogZoek','facLogSchrijf','openFacScanLog']
                                                  .every(f => typeof w[f] === 'function')],
    ['Log: modaal aanwezig',               () => !!d.getElementById('facScanLogModal') &&
                                                 !!d.getElementById('facScanLogBody')],

    /* ── Nieuwe factuur is pas echt na Opslaan ──
       De hele belofte in één test: maak er een, sluit zonder opslaan, en er
       mag niets in de administratie zijn beland. */
    ['Concept: functies aanwezig',         () => ['factuurNieuw','facIsConcept','facConceptOpslaan',
                                                  'facConceptVastleggen','facOpenEditor','closeFacEditor']
                                                  .every(f => typeof w[f] === 'function')],
    ['Concept: nieuw staat nog niet in de administratie', () => {
      const inLijst = id => (w.huidigeStateSnapshot().facturen.invoices || []).some(x => x.id === id);
      const f = w.factuurNieuw(null, null, null);
      const nogNiet = !inLijst(f.id);
      const vindbaar = w.factuurById(f.id) === f && w.facIsConcept(f);
      w.facOpenEditor(f.id);
      w.closeFacEditor();                       /* niets gewijzigd → geen vraag */
      return nogNiet && vindbaar && !inLijst(f.id) && w.factuurById(f.id) === null;
    }],

    /* ── De voet van een verstuurde factuur ──
       Twee dingen die je niet aan de code ziet: er is precies één mintknop
       (hij sprong eerder tussen Mailen en Betaling registreren, afhankelijk
       van of je gemaild had), en alle knoppen passen op één regel. Dat
       laatste toetsen we tegen de breedte van de editor zelf en niet tegen
       het testvenster — anders zakt de test met het venster mee. */
    ['Voet: één mintknop, en dat is Betaling registreren', () => {
      const f = w.factuurNieuw(null, null, null);
      w.facConceptVastleggen();                 /* pas dan telt hij niet meer als concept */
      f.status = 'verstuurd';
      f.vervaldatum = '2020-01-01';             /* te laat, dus óók de knop Herinnering */
      try {
        w.facOpenEditor(f.id);
        const bar = d.getElementById('facEditorActies');
        const knoppen = [...bar.children].filter(el => el.textContent.trim());
        const mint = knoppen.filter(el => el.classList.contains('uren-btn-primary'));
        const nodig = knoppen.reduce((a, el) => a + el.offsetWidth, 0) + 6 * (knoppen.length - 1);
        return knoppen.length === 8 && mint.length === 1 &&
               mint[0].textContent.trim() === 'Betaling registreren' &&
               nodig <= 1000 - 44;              /* 1000px modaal, 22px padding links en rechts */
      } finally {
        w.closeFacEditor();
        /* factuurState is een top-level `let` en staat dus niet op window;
           de snapshot geeft dezelfde array terug, dus opruimen kan hier. */
        const arr = (w.huidigeStateSnapshot().facturen || {}).invoices || [];
        const i = arr.findIndex(x => x.id === f.id);
        if (i >= 0) arr.splice(i, 1);
      }
    }],

    ['No iframe console errors',           () => iframeErrors.length === 0]
  ];

  let pass = 0, fail = 0;
  checks.innerHTML = tests.map(([name, fn]) => {
    let ok=false, err='';
    try { ok = !!fn(); } catch(e){ err = ' — ' + e.message; }
    if (ok) pass++; else fail++;
    return `<div class="check ${ok?'ok':'fail'}">${ok?'✓':'✗'} ${name}${err}</div>`;
  }).join('');

  if (iframeErrors.length) {
    checks.innerHTML += '<div class="check warn">⚠ Console errors:</div>' +
      iframeErrors.map(e => `<div class="check warn">  ${e}</div>`).join('');
  }

  summary.innerHTML = `<div class="summary ${fail===0?'allgreen':'hasfail'}">${pass}/${tests.length} passed${fail?` · ${fail} FAILED`:''}</div>`;
}
</script>
</body>
</html>
