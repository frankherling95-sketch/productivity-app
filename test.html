<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<title>Herling Analytics — Smoke test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:grid;grid-template-rows:auto 1fr;height:100vh}
  .results{padding:16px 20px;background:#f7f6f3;border-bottom:1px solid #ddd;overflow:auto;max-height:240px}
  .results h1{margin:0 0 10px;font-size:16px}
  .check{padding:3px 0;font-family:monospace;font-size:13px}
  .check.ok{color:#2f9e44}
  .check.fail{color:#c92a2a}
  .check.warn{color:#e67700}
  .summary{margin-top:8px;padding:8px;border-radius:6px;font-weight:600}
  .summary.allgreen{background:#d3f9d8;color:#2b8a3e}
  .summary.hasfail{background:#ffe3e3;color:#c92a2a}
  iframe{width:100%;height:100%;border:none;background:#fff}
</style>
</head>
<body>
<div class="results">
  <h1>🧪 Smoke test — index.html</h1>
  <div id="checks"><div class="check">Loading app…</div></div>
  <div id="summary"></div>
</div>
<iframe id="app" src="index.html"></iframe>
<script>
const checks = document.getElementById('checks');
const summary = document.getElementById('summary');
const errors = [];
window.addEventListener('error', e => errors.push(e.message));
window.addEventListener('unhandledrejection', e => errors.push('Promise: ' + (e.reason?.message || e.reason)));

const iframe = document.getElementById('app');
const iframeErrors = [];
let gedraaid = false;

/* ── Dit bestand heeft een server nodig ──
   Via file:// is elk document een eigen origin, dus iframe.contentWindow
   is afgeschermd en elke test zou op een SecurityError stuklopen. Eerder
   bleef het scherm dan stil op "Loading app…" staan zonder te zeggen
   waarom. Nu zegt het wat je moet doen. */
function meldServerNodig(reden) {
  gedraaid = true;
  checks.innerHTML =
    '<div class="check fail">✗ ' + reden + '</div>' +
    '<div class="check">Deze test heeft een lokale webserver nodig. Start er een in de projectmap:</div>' +
    '<div class="check" style="user-select:all;background:#fff;padding:6px 8px;border-radius:4px;margin:6px 0">' +
    'npx --yes http-server . -p 8765 -c-1 --silent</div>' +
    '<div class="check">Open daarna <a href="http://localhost:8765/test.html">http://localhost:8765/test.html</a></div>';
  summary.className = 'summary hasfail';
  summary.textContent = 'Niet gedraaid — server nodig';
}

if (location.protocol === 'file:') {
  meldServerNodig('Geopend via file:// — de browser schermt de iframe dan af.');
} else {
  iframe.addEventListener('load', () => {
    try {
      iframe.contentWindow.addEventListener('error', e => iframeErrors.push(e.message));
    } catch (e) {
      meldServerNodig('Geen toegang tot de iframe: ' + e.message);
      return;
    }
    /* Wait a beat for boot to finish (loadGist is async) */
    setTimeout(runChecks, 1500);
  });
  /* Vangnet: blijft het om welke reden dan ook hangen, zeg dat dan ook. */
  setTimeout(() => {
    if (!gedraaid) meldServerNodig('De app in de iframe reageerde niet binnen 10 seconden.');
  }, 10000);
}

/* ── Bouwstenen voor de sync-tests ──
   Eén vaste state: map 'Klanten' met twee pagina's, plus twee checklist-
   items, drie urenregels, één factuur en twee klanten. Samen 11 items voor
   stateOmvang (die telt de map mee) en 2 notities voor versieTelling (die
   telt alleen pagina's). Elke aanroep geeft een verse kopie, zodat een test
   die muteert de volgende niet beïnvloedt. */
function mkState() {
  return {
    notes:{tree:[{id:'n1',type:'folder',title:'Klanten',children:[
      {id:'n2',type:'page',title:'Acme',content:'x'.repeat(900),children:[]},
      {id:'n3',type:'page',title:'Verdwenen notitie',content:'yyyy',children:[]}
    ]}]},
    checklist:{items:[{id:'c1'},{id:'c2'}]},
    uren:{entries:[{id:'u1'},{id:'u2'},{id:'u3'}]},
    facturen:{invoices:[{id:'f1'}]},
    tasks:{clients:[{id:'k1'},{id:'k2'}]}
  };
}
/* Dezelfde state, maar één notitie is verdwenen — het scenario van 20-8. */
function zonderNotitie() {
  const s = mkState();
  s.notes.tree[0].children = s.notes.tree[0].children.filter(n => n.id !== 'n3');
  return s;
}
/* Notitie bestaat nog, maar de tekst is grotendeels weg. */
function metKorteTekst() {
  const s = mkState();
  vindNotitie(s, 'n2').content = 'xx';
  return s;
}
function vindNotitie(state, id) {
  const zoek = nodes => {
    for (const n of nodes || []) {
      if (n.id === id) return n;
      const t = zoek(n.children);
      if (t) return t;
    }
    return null;
  };
  return zoek((state.notes || {}).tree);
}

async function runChecks() {
  gedraaid = true;
  let w, d;
  try {
    w = iframe.contentWindow;
    d = w.document;
    if (!d) throw new Error('geen document');
  } catch (e) {
    meldServerNodig('Geen toegang tot de iframe: ' + e.message);
    return;
  }
  /* Een paar sleutels in localStorage tijdelijk zetten (null = weghalen) en
     daarna terugzetten zoals ze waren. De tests delen hun opslag met de app
     op dezelfde poort: wie zelf Claude heeft gekozen mag de Gemini-tests niet
     laten falen, en omgekeerd. */
  const metLS = async (zet, fn) => {
    const oud = {};
    for (const k in zet) {
      oud[k] = w.localStorage.getItem(k);
      if (zet[k] === null) w.localStorage.removeItem(k); else w.localStorage.setItem(k, zet[k]);
    }
    try { return await fn(); }
    finally {
      for (const k in oud) {
        if (oud[k] === null) w.localStorage.removeItem(k); else w.localStorage.setItem(k, oud[k]);
      }
    }
  };
  /* ── Wat een test van de omgeving nodig heeft (2026-10-14) ──
     De suite moet in elke browser groen zijn, ook in een leeg profiel zonder
     login, in een smal of onzichtbaar venster. Wie iets nodig heeft, zet het
     hier even neer en ruimt het daarna op. */
  /* Minstens één klant: een paar tests gebruiken "de eerste klant". */
  const metKlant = async fn => {
    const leeg = w.eval('kanbanState.clients.length===0');
    if (leeg) w.eval("kanbanState.clients.push({id:'tKE',name:'Klant E',colorIdx:0})");
    try { return await fn(); }
    finally { if (leeg) w.eval("kanbanState.clients=kanbanState.clients.filter(c=>c.id!=='tKE')"); }
  };
  /* Een bureaubladbreedte: de iframe is zo breed als dit venster, en dat is
     in een testbrowser vaak smaller dan 769px -- dan is de app een telefoon. */
  const opBreed = async fn => {
    const oud = iframe.style.width;
    iframe.style.width = '1400px';
    void iframe.offsetWidth;
    await new Promise(r => setTimeout(r, 80));
    try { return await fn(); }
    finally { iframe.style.width = oud; void iframe.offsetWidth; await new Promise(r => setTimeout(r, 40)); }
  };
  /* Een ingelogde gebruiker (met naam), zoals Frank altijd is. */
  const login = naam => JSON.stringify({email: 'test@herling-analytics.nl', naam, tot: Date.now() + 864e5});
  const metLogin = (fn, naam) => metLS({herling_login: login(naam === undefined ? 'Jan Jansen' : naam)}, fn);
  /* ── Google-accounts voor Agenda en Mail (2026-10-11) ──
     zonderAccounts: alsof er niets gekoppeld is (wie zelf accounts heeft,
     mag de tests van de gewone chat niet laten falen). metGoogle: twee
     verzonnen accounts met een token in het geheugen, en een fetch die de
     Calendar- en de Gmail-API naspeelt. Er gaat niets naar Google, er wordt
     niets bewaard, en na afloop staat alles terug. */
  const accountsTerug = oud => w.eval('if(' + oud + '===null)delete rawState.settings.googleAccounts;' +
    'else rawState.settings.googleAccounts=' + oud + ';gaccTok={};kalCache={};kalKalenders={};pvLijst=null;pvDraden={};pvOngelezen={};' +
    'clearTimeout(gaccVerversTimer);gaccVerversTimer=null;if(gaccGebaarAf)gaccGebaarAf();for(const k in gaccRust)delete gaccRust[k];' +
    'for(const k in googleStilUit)delete googleStilUit[k];gaccGebruiktOp=0;gaccStilRondeOp=0;' +
    'if(window.__stilEcht){googleStilToken=window.__stilEcht;delete window.__stilEcht;}');
  const zonderAccounts = async fn => {
    const oud = w.eval('JSON.stringify((rawState.settings||{}).googleAccounts||null)');
    w.eval('rawState.settings=rawState.settings||{};rawState.settings.googleAccounts=[]');
    try { return await fn(); } finally { accountsTerug(oud); }
  };
  const metGoogle = async fn => {
    const oud = w.eval('JSON.stringify((rawState.settings||{}).googleAccounts||null)');
    const oudFetch = w.fetch, log = [], verzonden = [];
    w.eval(`rawState.settings=rawState.settings||{};rawState.settings.googleAccounts=[
      {id:'tz',email:'test@herling-analytics.nl',naam:'Zakelijk',agenda:true,mail:true,kalKeuze:{}},
      {id:'tp',email:'jan.jansen@voorbeeld.nl',naam:'Privé',agenda:true,mail:true,kalKeuze:{}}];
      gaccTok={};gaccLijst().forEach(a=>{gaccTok[a.email]={token:'tok-'+a.email,tot:Date.now()+3600e3,scope:GACC_SCOPES};});
      kalCache={};kalKalenders={};pvLijst=null;pvDraden={};pvOngelezen={};
      if(!window.__stilEcht)window.__stilEcht=googleStilToken;
      googleStilToken=()=>Promise.reject(Object.assign(new Error('test'),{type:'stil',reden:'test'}));`);
    const b64 = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const nu = new Date();
    const om = (u, m) => { const x = new Date(nu); x.setHours(u, m || 0, 0, 0); return x.toISOString(); };
    const labels = {t1: ['INBOX', 'UNREAD'], t2: ['INBOX']};
    const draad = (id, van, ond, uur) => ({id, messages: [{id: id + 'm', labelIds: labels[id],
      internalDate: String(new Date(om(uur)).getTime()), snippet: 'Hallo &amp; tot ziens',
      payload: {mimeType: 'multipart/alternative', headers: [{name: 'From', value: van}, {name: 'Subject', value: ond},
        {name: 'Message-ID', value: '<' + id + '@voorbeeld.nl>'}],
        parts: [{mimeType: 'text/plain', body: {data: b64('Tekst over ' + ond)}}]}}]});
    w.fetch = async (url, o) => {
      const u = String(url), m = (o && o.method) || 'GET';
      if (!/googleapis\.com/.test(u)) return oudFetch(url, o);
      const wie = ((o && o.headers && o.headers.Authorization) || '').replace('Bearer tok-', '');
      log.push(m + ' ' + u.replace(/^https:\/\/[^/]+/, '') + ' ' + wie);
      const antw = (b, s) => new w.Response(b == null ? null : JSON.stringify(b), {status: s || 200});
      if (/calendarList/.test(u)) return antw({items: wie.startsWith('test')
        ? [{id: 'k-z', summary: 'Werk', backgroundColor: '#039BE5', primary: true, accessRole: 'owner', selected: true}]
        : [{id: 'k-p', summary: 'Prive', backgroundColor: '#8E24AA', primary: true, accessRole: 'owner', selected: true},
           {id: 'k-uit', summary: 'Verjaardagen', backgroundColor: '#F6BF26', accessRole: 'reader', selected: false}]});
      if (/\/events/.test(u) && m === 'GET') return antw({items: /k-z/.test(u)
        ? [{id: 'e1', summary: 'Overleg', start: {dateTime: om(9)}, end: {dateTime: om(10)}, organizer: {self: true}},
           {id: 'e2', summary: 'Afgezegd', start: {dateTime: om(11)}, end: {dateTime: om(12)},
            attendees: [{self: true, email: 'test@herling-analytics.nl', responseStatus: 'declined'}]}]
        : /k-p/.test(u) ? [{id: 'e3', summary: 'Tandarts', start: {dateTime: om(9, 30)}, end: {dateTime: om(10, 30)}, organizer: {self: true}}]
        : [{id: 'e4', summary: 'Hoort niet zichtbaar te zijn', start: {dateTime: om(8)}, end: {dateTime: om(9)}}]});
      if (/\/events/.test(u)) return m === 'DELETE' ? antw(null, 204) : antw({id: 'nieuw1'});
      if (/labels\/INBOX/.test(u)) return antw({threadsUnread: wie.startsWith('test') ? 1 : 0});
      if (/settings\/sendAs/.test(u)) return antw({sendAs: [{sendAsEmail: wie, isDefault: true, displayName: 'Test',
        signature: '<div>Met vriendelijke groet,<br>Test</div>'}]});
      if (/\/messages\/send/.test(u)) { verzonden.push(JSON.parse(o.body)); return antw({id: 'verzonden1'}); }
      if (/\/threads\?/.test(u)) return antw({threads: wie.startsWith('test') ? [{id: 't1'}] : [{id: 't2'}]});
      const t = u.match(/\/threads\/(t\d)(\/modify|\/trash|\/untrash)?/);
      if (t) {
        if (t[2]) {
          const b = o && o.body ? JSON.parse(o.body) : {};
          labels[t[1]] = labels[t[1]].filter(l => !(b.removeLabelIds || []).includes(l)).concat(b.addLabelIds || []);
          return antw({id: t[1]});
        }
        return antw(t[1] === 't1' ? draad('t1', 'Jan Jansen <iemand@voorbeeld.nl>', 'Offerte', 10)
          : draad('t2', 'Voorbeeld Energie <info@voorbeeld-energie.nl>', 'Jaarafrekening', 8));
      }
      return antw({error: {message: 'onbekend in de test'}}, 404);
    };
    try { return await fn(log, labels, verzonden); }
    finally {
      w.fetch = oudFetch;
      accountsTerug(oud);
      try { w.updateNavBadges(); } catch (_) {}
    }
  };
  const tests = [
    ['Module: Dashboard exists',           () => !!d.getElementById('mod-dashboard')],
    ['Module: Kanban is weg',              () => !d.getElementById('mod-todo')],
    ['Nav: geen todo-item meer',           () => !d.querySelector('[data-mod="todo"]')],
    ['Module: Notes exists',               () => !!d.getElementById('mod-notes')],
    ['Module: Checklist exists',           () => !!d.getElementById('mod-checklist')],
    /* De iCal-agenda ging er op 2026-09-06 uit; op 2026-10-11 kwam er een
       nieuwe voor in de plaats, op de Google-accounts, met Mail ernaast. */
    ['Module: Agenda en Mail bestaan, met een regel in de zijbalk', () =>
      !!d.getElementById('mod-agenda') && !!d.getElementById('mod-mail') &&
      !!d.querySelector('.nav-item[data-mod="agenda"]') && !!d.querySelector('.nav-item[data-mod="mail"]')],
    /* Niet via w.rawState: dat is een top-level `let` en die staat niet op
       window, dus deze drie stonden altijd op rood en zeiden niets. Via de
       snapshot-functie kunnen we de state wél bereiken — en meteen
       controleren dat de modules erin zitten in plaats van alleen dat er
       een naam bestaat. */
    ['State: bereikbaar via snapshot',     () => !!w.huidigeStateSnapshot()],
    ['State: klanten in de state',         () => Array.isArray((w.huidigeStateSnapshot().tasks||{}).clients)],
    ['State: checklist in de state',       () => typeof w.huidigeStateSnapshot().checklist === 'object'],
    ['State: notities in de state',        () => Array.isArray((w.huidigeStateSnapshot().notes||{}).tree)],
    ['Function: saveGist defined',         () => typeof w.saveGist === 'function'],
    ['Function: scheduleSave defined',     () => typeof w.scheduleSave === 'function'],
    ['Function: saveLocalBackup defined',  () => typeof w.saveLocalBackup === 'function'],
    ['Function: switchModule defined',     () => typeof w.switchModule === 'function'],
    ['Function: renderChecklistModule',    () => typeof w.renderChecklistModule === 'function'],
    ['Sidebar logo present',               () => d.querySelector('.sidebar-logo,.sidebar img,svg[viewBox]')],
    ['localStorage backup writable',       () => { try{ w.localStorage.setItem('test_smoke','1'); w.localStorage.removeItem('test_smoke'); return true }catch(e){return false} }],

    /* ── Sync- en herstellogica ──
       Dit is sinds 2026-08-21 het gevaarlijkste stuk van de app: hier kan
       een fout stilletjes data wissen. Het is puur functioneel (state in,
       state uit, geen netwerk), dus het hoort hier getest te worden en niet
       met de hand in de console. */
    ['Sync: functies aanwezig',            () => ['stateOmvang','voegStateSamen','versieTelling',
                                                  'driveRevisies','driveRevisieState','openVersiesModal']
                                                  .every(f => typeof w[f] === 'function')],
    ['stateOmvang: onzin geeft 0',         () => [null, undefined, {}, 'tekst']
                                                  .every(x => w.stateOmvang(x) === 0)],
    ['stateOmvang: telt alle modules',     () => w.stateOmvang(mkState()) === 11],
    ['stateOmvang: leeg < 90% van vol',    () => w.stateOmvang({}) < Math.floor(w.stateOmvang(mkState())*0.9)],

    ['Merge: ontbrekende notitie komt terug', () => {
      const r = w.voegStateSamen(mkState(), zonderNotitie());
      return r.rapport.notities === 1 &&
             vindNotitie(r.state, 'n3') && vindNotitie(r.state, 'n3').content === 'yyyy';
    }],
    ['Merge: ingekorte tekst wordt hersteld', () => {
      const r = w.voegStateSamen(mkState(), metKorteTekst());
      return r.rapport.tekst === 1 && vindNotitie(r.state, 'n2').content.length === 900;
    }],
    ['Merge: langere tekst blijft staan',   () => {
      const nu = mkState();
      vindNotitie(nu, 'n2').content = 'z'.repeat(2000);
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.tekst === 0 && vindNotitie(r.state, 'n2').content.length === 2000;
    }],
    ['Merge: nieuwere uren blijven behouden', () => {
      const nu = mkState();
      nu.uren.entries.push({id:'u9'});
      const r = w.voegStateSamen(mkState(), nu);
      return r.state.uren.entries.length === 4 && r.rapport.uren === 0;
    }],
    ['Merge: ontbrekende factuur wordt aangevuld', () => {
      const nu = mkState();
      nu.facturen.invoices = [];
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.facturen === 1 && r.state.facturen.invoices.length === 1;
    }],
    ['Merge: raakt de invoer niet aan',     () => {
      const oud = mkState(), nu = zonderNotitie();
      const voor = JSON.stringify([oud, nu]);
      w.voegStateSamen(oud, nu);
      return JSON.stringify([oud, nu]) === voor;
    }],
    ['Merge: gelijke states geven leeg rapport', () => {
      const r = w.voegStateSamen(mkState(), mkState());
      return w.versieRapportTekst(r.rapport) === null;
    }],
    ['versieTelling: mappen tellen niet mee', () => {
      const t = w.versieTelling(mkState());
      return t.notities === 2 && t.uren === 3 && t.facturen === 1 && t.klanten === 2;
    }],

    /* ── Vastpinnen ──
       Twee eisen: vastgepind staat bovenaan, en onderling verandert er niets
       aan de volgorde. Beide tests zijn onafhankelijk van de gekozen
       sorteermodus, zodat ze niet omvallen door wat er in Drive staat. */
    ['Pin: vastgepind gaat voor de rest', () =>
      w.clVastCmp({pinned:true}, {}) < 0 &&
      w.clVastCmp({}, {pinned:true}) > 0 &&
      w.clVastCmp({pinned:true}, {pinned:true}) === 0 &&
      w.clVastCmp({}, {}) === 0],
    ['Pin: sortering zet vastgepind bovenaan', () => {
      const cmp = w.clSortCmp();
      const lijst = [
        {id:'a', text:'Aaa', createdAt:3, sortOrder:1, deadline:'2026-01-01'},
        {id:'b', text:'Zzz', createdAt:1, sortOrder:9, deadline:'2026-12-31', pinned:true},
        {id:'c', text:'Mmm', createdAt:2, sortOrder:5, deadline:'2026-06-15'}
      ];
      return lijst.slice().sort(cmp).map(i => i.id)[0] === 'b';
    }],
    ['Pin: onderling geldt de gewone volgorde', () => {
      const cmp = w.clSortCmp();
      const p1 = {id:'p1', text:'Alfa', createdAt:1, sortOrder:1, deadline:'2026-01-01'};
      const p2 = {id:'p2', text:'Beta', createdAt:2, sortOrder:2, deadline:'2026-02-01'};
      const zonder = Math.sign(cmp(p1, p2));
      const met    = Math.sign(cmp({...p1, pinned:true}, {...p2, pinned:true}));
      return zonder !== 0 && zonder === met;
    }],

    /* ── Anonimiseren ──
       De maskeerder draait op de echte klantenlijst uit de iframe, dus deze
       tests toetsen niet één vaste naam maar de eigenschap die telt: wat
       eruit komt is weer precies wat erin ging. Zijn er geen klanten, dan
       zeggen de eerste twee niets en worden ze overgeslagen. */
    ['Masker: functies aanwezig',          () => ['aiMaskerder','aiMaskerenAan','aiMaskerenWissel']
                                                  .every(f => typeof w[f] === 'function')],
    ['Masker: klantnaam gaat eruit en weer terug', () => {
      const klant = (w.huidigeStateSnapshot().tasks.clients || [])[0];
      if (!klant || !klant.name || klant.name.length < 3) return true;   /* niets te maskeren */
      const m = w.aiMaskerder();
      const zin = 'rapport voor ' + klant.name + ' afronden';
      const weg = m.maskeer(zin);
      return !weg.includes(klant.name) && /\{\{KLANT_\d\}\}/.test(weg) && m.ontmaskeer(weg) === zin;
    }],
    ['Masker: mail en telefoon gaan eruit', () => {
      const m = w.aiMaskerder();
      const zin = 'bel 06-12345678 of mail naar iemand@voorbeeld.nl';
      const weg = m.maskeer(zin);
      return !weg.includes('12345678') && !weg.includes('@') && m.ontmaskeer(weg) === zin;
    }],
    ['Masker: deelwoord blijft ongemoeid', () => {
      const m = w.aiMaskerder();
      /* Een token mag niet middenin een langer woord landen. */
      const zin = 'onbekendbedrijfplein 4 is geen klant';
      return m.maskeer(zin) === zin;
    }],
    ['Masker: slordig teruggeschreven token landt toch', () => {
      const klant = (w.huidigeStateSnapshot().tasks.clients || [])[0];
      if (!klant || !klant.name || klant.name.length < 3) return true;
      const m = w.aiMaskerder();
      m.maskeer(klant.name);
      const t = m.maskeer(klant.name).match(/\{\{(KLANT_\d)\}\}/)[1];
      return m.ontmaskeer('bij {{ ' + t + ' }} gedaan') === 'bij ' + klant.name + ' gedaan' &&
             m.ontmaskeer('bij ' + t + ' gedaan')       === 'bij ' + klant.name + ' gedaan';
    }],
    ['Masker: JSON-antwoord wordt diep terugvertaald', () => {
      const m = w.aiMaskerder();
      const weg = m.maskeer('mail naar iemand@voorbeeld.nl');
      const uit = m.ontmaskeerDiep({ a:[{ b:weg }], c:{ [weg]:null }, d:false });
      return uit.a[0].b === 'mail naar iemand@voorbeeld.nl' &&
             Object.keys(uit.c)[0] === 'mail naar iemand@voorbeeld.nl' &&
             uit.c[Object.keys(uit.c)[0]] === null && uit.d === false;
    }],
    ['Masker: stroom lijmt een gebroken token', () => {

    /* Een antwoord gaat pas weg na Versturen, en Niet versturen houdt hem tegen. */
    ['Mail: antwoord pas weg na Versturen, met de hele mail en Niet versturen', () => metGoogle(async (log, labels, verzonden) => {
      const oudWacht = w.eval('pvVerstuurWacht');
      try {
        w.eval('pvVerstuurWacht=120');
        await w.pvOpen('tz|t1');
        await w.pvConceptOpen('tz|t1', 'Prima, donderdag past.');
        const zichtbaar = d.getElementById('pvConModal').classList.contains('open') &&
          /iemand@voorbeeld\.nl/.test(d.getElementById('pvConAan').value) &&
          /^Re: Offerte/.test(d.getElementById('pvConOnderwerp').value) &&
          /Met vriendelijke groet/.test(d.getElementById('pvConSig').textContent) && !verzonden.length;
        d.getElementById('pvConVerstuur').click();
        /* Meteen kijken: het wachten loopt via een timer, die kan nog niet zijn afgegaan. */
        const nogNiet = !verzonden.length;
        w.appToastUndo();                                /* Niet versturen */
        await new Promise(r => setTimeout(r, 250));
        const tegengehouden = !verzonden.length && d.getElementById('pvConModal').classList.contains('open') &&
          d.getElementById('pvConTekst').value === 'Prima, donderdag past.';
        d.getElementById('pvConVerstuur').click();
        /* Wachten tot hij weg is, in plaats van een vaste 400 ms: in een volle
           pagina duurde het soms net langer (2026-10-14). */
        for (let i = 0; i < 60 && !verzonden.length; i++) await new Promise(r => setTimeout(r, 50));
        await new Promise(r => setTimeout(r, 50));
        const b = verzonden[0] || {};
        const mime = atob(String(b.raw || '').replace(/-/g, '+').replace(/_/g, '/'));
        const lijf = decodeURIComponent(escape(atob(mime.split('\r\n\r\n')[1].replace(/\s+/g, ''))));
        return zichtbaar && nogNiet && tegengehouden && verzonden.length === 1 && b.threadId === 't1' &&
          /^To: Jan Jansen <iemand@voorbeeld\.nl>/m.test(mime) && /^Subject: Re: Offerte/m.test(mime) &&
          /^In-Reply-To: <t1@voorbeeld\.nl>/m.test(mime) && /^From: Test <test@herling-analytics\.nl>/m.test(mime) &&
          lijf.startsWith('Prima, donderdag past.') && /Met vriendelijke groet,\nTest/.test(lijf);
      } finally {
        w.eval('pvVerstuurWacht=' + oudWacht);
        try { w.pvConceptSluit(); w.pvSluit(); w.appToastHide(); } catch (_) {}
      }
    })],
    ['Mail: archiveren haalt uit Postvak, terugzetten zet hem terug', () => metLS({herling_pv: null}, () => metGoogle(async (log, labels) => {
      await w.pvLaad(false);
      await w.pvDoe(['tz|t1'], 'archiveer', true);
      const weg = !labels.t1.includes('INBOX') && !w.eval('pvLijst.items.some(x=>x.key==="tz|t1")');
      await w.pvDoe(['tz|t1'], 'terugInPostvak', true);
      return weg && labels.t1.includes('INBOX');
    }))],
    ['Chat: opzoeken in mail gaat terug naar het model (met handtekening), daarna een voorstel', () =>
      metLS({herling_ai_aanbieder: null, herling_claude_api_key: 'test', herling_ai_maskeren: null}, () => metGoogle(async () => {
        const ev = (type, data) => 'event: ' + type + '\ndata: ' + JSON.stringify({type, ...data}) + '\n\n';
        const bodies = [];
        const googleFetch = w.fetch, oudTel = w._aiBumpUsage;
        w._aiBumpUsage = () => {};
        w.fetch = async (u, o) => {
          if (!/anthropic/.test(String(u))) return googleFetch(u, o);
          bodies.push(JSON.parse(o.body));
          let sse = ev('message_start', {message: {}});
          if (bodies.length === 1) sse +=
            ev('content_block_start', {index: 0, content_block: {type: 'thinking', thinking: '', signature: ''}}) +
            ev('content_block_delta', {index: 0, delta: {type: 'signature_delta', signature: 'HANDTEKENING'}}) +
            ev('content_block_stop', {index: 0}) +
            ev('content_block_start', {index: 1, content_block: {type: 'tool_use', id: 'toolu_z', name: 'mail_zoeken', input: {}}}) +
            ev('content_block_delta', {index: 1, delta: {type: 'input_json_delta',
              partial_json: JSON.stringify({zoekopdracht: 'offerte', account: 'Zakelijk', max: 5})}}) +
            ev('content_block_stop', {index: 1}) + ev('message_delta', {delta: {stop_reason: 'tool_use'}});
          else sse +=
            ev('content_block_start', {index: 0, content_block: {type: 'text', text: ''}}) +
            ev('content_block_delta', {index: 0, delta: {type: 'text_delta', text: 'Jan vraagt naar de offerte.'}}) +
            ev('content_block_stop', {index: 0}) +
            ev('content_block_start', {index: 1, content_block: {type: 'tool_use', id: 'toolu_a', name: 'mail_opruimen', input: {}}}) +
            ev('content_block_delta', {index: 1, delta: {type: 'input_json_delta', partial_json: JSON.stringify({ids: ['tz|t1'], actie: 'archiveren'})}}) +
            ev('content_block_stop', {index: 1}) + ev('message_delta', {delta: {stop_reason: 'tool_use'}});
          return new w.Response(sse + ev('message_stop', {}), {status: 200, headers: {'Content-Type': 'text/event-stream'}});
        };
        try {
          w.eval('aiChatGesprek=[]');
          await w.aiChatVraag('Wat vraagt Jan over de offerte?');
          const b2 = bodies[1] || {messages: []};
          const rollen = b2.messages.map(m => m.role + ':' + (typeof m.content === 'string' ? 'tekst' : m.content.map(c => c.type).join(',')));
          const slot = b2.messages[b2.messages.length - 1] || {content: []};
          const resultaat = String((slot.content[0] || {}).content || '');
          const laatste = w.eval('aiChatGesprek[aiChatGesprek.length-1]');
          return bodies.length === 2 && rollen.slice(-2).join('|') === 'assistant:thinking,tool_use|user:tool_result' &&
            JSON.stringify(b2.messages).includes('HANDTEKENING') && /Offerte/.test(resultaat) &&
            !/iemand@voorbeeld\.nl/.test(resultaat) && JSON.stringify(bodies[0].system) === JSON.stringify(b2.system) &&
            laatste.lees.length === 1 && !laatste.lees[0].bezig && laatste.acties.length === 1 &&
            laatste.acties[0].status === 'voorstel' && laatste.acties[0].titel === 'Mail archiveren';
        } finally { w.fetch = googleFetch; w._aiBumpUsage = oudTel; w.eval('aiChatGesprek=[]'); }
      }))],
    ['No iframe console errors',           () => iframeErrors.length === 0]
  ];

  let pass = 0, fail = 0;
  /* Await per test: sommige dingen die je wilt toetsen zijn async (het
     uitlezen van een foutantwoord, een stapel door één verzoek). Zonder await
     kreeg zo'n test een Promise terug — altijd waar, dus altijd groen, dus
     waardeloos. */
  const regels = [];
  /* Tests die een Claude-antwoord nabootsen, tellen dat als verbruik
     (aiVerbruikTel). Na afloop staat het weer zoals het was. */
  const verbruikVoor = w.eval('JSON.stringify((rawState.settings||{}).aiVerbruik||null)');
  for (const [name, fn] of tests) {
    /* Welke test er loopt: blijft er een hangen, dan zie je welke. */
    checks.innerHTML = '<div class="check">Bezig (' + (regels.length + 1) + '/' + tests.length + '): ' + name + '</div>';
    let ok=false, err='';
    try { ok = !!(await fn()); } catch(e){ err = ' — ' + e.message; }
    if (ok) pass++; else fail++;
    regels.push(`<div class="check ${ok?'ok':'fail'}">${ok?'✓':'✗'} ${name}${err}</div>`);
  }
  try { w.eval('rawState.settings.aiVerbruik=' + verbruikVoor); } catch (_) {}
  checks.innerHTML = regels.join('');

  if (iframeErrors.length) {
    checks.innerHTML += '<div class="check warn">⚠ Console errors:</div>' +
      iframeErrors.map(e => `<div class="check warn">  ${e}</div>`).join('');
  }

  summary.innerHTML = `<div class="summary ${fail===0?'allgreen':'hasfail'}">${pass}/${tests.length} passed${fail?` · ${fail} FAILED`:''}</div>`;
}
</script>
</body>
</html>
