<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<title>Herling Analytics — Smoke test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:grid;grid-template-rows:auto 1fr;height:100vh}
  .results{padding:16px 20px;background:#f7f6f3;border-bottom:1px solid #ddd;overflow:auto;max-height:240px}
  .results h1{margin:0 0 10px;font-size:16px}
  .check{padding:3px 0;font-family:monospace;font-size:13px}
  .check.ok{color:#2f9e44}
  .check.fail{color:#c92a2a}
  .check.warn{color:#e67700}
  .summary{margin-top:8px;padding:8px;border-radius:6px;font-weight:600}
  .summary.allgreen{background:#d3f9d8;color:#2b8a3e}
  .summary.hasfail{background:#ffe3e3;color:#c92a2a}
  iframe{width:100%;height:100%;border:none;background:#fff}
</style>
</head>
<body>
<div class="results">
  <h1>🧪 Smoke test — index.html</h1>
  <div id="checks"><div class="check">Loading app…</div></div>
  <div id="summary"></div>
</div>
<iframe id="app" src="index.html"></iframe>
<script>
const checks = document.getElementById('checks');
const summary = document.getElementById('summary');
const errors = [];
window.addEventListener('error', e => errors.push(e.message));
window.addEventListener('unhandledrejection', e => errors.push('Promise: ' + (e.reason?.message || e.reason)));

const iframe = document.getElementById('app');
const iframeErrors = [];
let gedraaid = false;

/* ── Dit bestand heeft een server nodig ──
   Via file:// is elk document een eigen origin, dus iframe.contentWindow
   is afgeschermd en elke test zou op een SecurityError stuklopen. Eerder
   bleef het scherm dan stil op "Loading app…" staan zonder te zeggen
   waarom. Nu zegt het wat je moet doen. */
function meldServerNodig(reden) {
  gedraaid = true;
  checks.innerHTML =
    '<div class="check fail">✗ ' + reden + '</div>' +
    '<div class="check">Deze test heeft een lokale webserver nodig. Start er een in de projectmap:</div>' +
    '<div class="check" style="user-select:all;background:#fff;padding:6px 8px;border-radius:4px;margin:6px 0">' +
    'npx --yes http-server . -p 8765 -c-1 --silent</div>' +
    '<div class="check">Open daarna <a href="http://localhost:8765/test.html">http://localhost:8765/test.html</a></div>';
  summary.className = 'summary hasfail';
  summary.textContent = 'Niet gedraaid — server nodig';
}

if (location.protocol === 'file:') {
  meldServerNodig('Geopend via file:// — de browser schermt de iframe dan af.');
} else {
  iframe.addEventListener('load', () => {
    try {
      iframe.contentWindow.addEventListener('error', e => iframeErrors.push(e.message));
    } catch (e) {
      meldServerNodig('Geen toegang tot de iframe: ' + e.message);
      return;
    }
    /* Wait a beat for boot to finish (loadGist is async) */
    setTimeout(runChecks, 1500);
  });
  /* Vangnet: blijft het om welke reden dan ook hangen, zeg dat dan ook. */
  setTimeout(() => {
    if (!gedraaid) meldServerNodig('De app in de iframe reageerde niet binnen 10 seconden.');
  }, 10000);
}

/* ── Bouwstenen voor de sync-tests ──
   Eén vaste state: map 'Klanten' met twee pagina's, plus twee checklist-
   items, drie urenregels, één factuur en twee klanten. Samen 11 items voor
   stateOmvang (die telt de map mee) en 2 notities voor versieTelling (die
   telt alleen pagina's). Elke aanroep geeft een verse kopie, zodat een test
   die muteert de volgende niet beïnvloedt. */
function mkState() {
  return {
    notes:{tree:[{id:'n1',type:'folder',title:'Klanten',children:[
      {id:'n2',type:'page',title:'Acme',content:'x'.repeat(900),children:[]},
      {id:'n3',type:'page',title:'Verdwenen notitie',content:'yyyy',children:[]}
    ]}]},
    checklist:{items:[{id:'c1'},{id:'c2'}]},
    uren:{entries:[{id:'u1'},{id:'u2'},{id:'u3'}]},
    facturen:{invoices:[{id:'f1'}]},
    tasks:{clients:[{id:'k1'},{id:'k2'}]},
    agenda:{events:[]}
  };
}
/* Dezelfde state, maar één notitie is verdwenen — het scenario van 20-8. */
function zonderNotitie() {
  const s = mkState();
  s.notes.tree[0].children = s.notes.tree[0].children.filter(n => n.id !== 'n3');
  return s;
}
/* Notitie bestaat nog, maar de tekst is grotendeels weg. */
function metKorteTekst() {
  const s = mkState();
  vindNotitie(s, 'n2').content = 'xx';
  return s;
}
function vindNotitie(state, id) {
  const zoek = nodes => {
    for (const n of nodes || []) {
      if (n.id === id) return n;
      const t = zoek(n.children);
      if (t) return t;
    }
    return null;
  };
  return zoek((state.notes || {}).tree);
}

function runChecks() {
  gedraaid = true;
  let w, d;
  try {
    w = iframe.contentWindow;
    d = w.document;
    if (!d) throw new Error('geen document');
  } catch (e) {
    meldServerNodig('Geen toegang tot de iframe: ' + e.message);
    return;
  }
  const tests = [
    ['Module: Dashboard exists',           () => !!d.getElementById('mod-dashboard')],
    ['Module: Todo exists',                () => !!d.getElementById('mod-todo')],
    ['Module: Notes exists',               () => !!d.getElementById('mod-notes')],
    ['Module: Agenda exists',              () => !!d.getElementById('mod-agenda')],
    ['Module: Checklist exists',           () => !!d.getElementById('mod-checklist')],
    /* Niet via w.rawState: dat is een top-level `let` en die staat niet op
       window, dus deze drie stonden altijd op rood en zeiden niets. Via de
       snapshot-functie kunnen we de state wél bereiken — en meteen
       controleren dat de modules erin zitten in plaats van alleen dat er
       een naam bestaat. */
    ['State: bereikbaar via snapshot',     () => !!w.huidigeStateSnapshot()],
    ['State: kanban in de state',          () => typeof w.huidigeStateSnapshot().tasks === 'object'],
    ['State: checklist in de state',       () => typeof w.huidigeStateSnapshot().checklist === 'object'],
    ['State: notities in de state',        () => Array.isArray((w.huidigeStateSnapshot().notes||{}).tree)],
    ['Function: saveGist defined',         () => typeof w.saveGist === 'function'],
    ['Function: scheduleSave defined',     () => typeof w.scheduleSave === 'function'],
    ['Function: saveLocalBackup defined',  () => typeof w.saveLocalBackup === 'function'],
    ['Function: switchModule defined',     () => typeof w.switchModule === 'function'],
    ['Function: renderChecklistModule',    () => typeof w.renderChecklistModule === 'function'],
    ['Sidebar logo present',               () => d.querySelector('.sidebar-logo,.sidebar img,svg[viewBox]')],
    ['localStorage backup writable',       () => { try{ w.localStorage.setItem('test_smoke','1'); w.localStorage.removeItem('test_smoke'); return true }catch(e){return false} }],

    /* ── Sync- en herstellogica ──
       Dit is sinds 2026-08-21 het gevaarlijkste stuk van de app: hier kan
       een fout stilletjes data wissen. Het is puur functioneel (state in,
       state uit, geen netwerk), dus het hoort hier getest te worden en niet
       met de hand in de console. */
    ['Sync: functies aanwezig',            () => ['stateOmvang','voegStateSamen','versieTelling',
                                                  'driveRevisies','driveRevisieState','openVersiesModal']
                                                  .every(f => typeof w[f] === 'function')],
    ['stateOmvang: onzin geeft 0',         () => [null, undefined, {}, 'tekst']
                                                  .every(x => w.stateOmvang(x) === 0)],
    ['stateOmvang: telt alle modules',     () => w.stateOmvang(mkState()) === 11],
    ['stateOmvang: leeg < 90% van vol',    () => w.stateOmvang({}) < Math.floor(w.stateOmvang(mkState())*0.9)],

    ['Merge: ontbrekende notitie komt terug', () => {
      const r = w.voegStateSamen(mkState(), zonderNotitie());
      return r.rapport.notities === 1 &&
             vindNotitie(r.state, 'n3') && vindNotitie(r.state, 'n3').content === 'yyyy';
    }],
    ['Merge: ingekorte tekst wordt hersteld', () => {
      const r = w.voegStateSamen(mkState(), metKorteTekst());
      return r.rapport.tekst === 1 && vindNotitie(r.state, 'n2').content.length === 900;
    }],
    ['Merge: langere tekst blijft staan',   () => {
      const nu = mkState();
      vindNotitie(nu, 'n2').content = 'z'.repeat(2000);
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.tekst === 0 && vindNotitie(r.state, 'n2').content.length === 2000;
    }],
    ['Merge: nieuwere uren blijven behouden', () => {
      const nu = mkState();
      nu.uren.entries.push({id:'u9'});
      const r = w.voegStateSamen(mkState(), nu);
      return r.state.uren.entries.length === 4 && r.rapport.uren === 0;
    }],
    ['Merge: ontbrekende factuur wordt aangevuld', () => {
      const nu = mkState();
      nu.facturen.invoices = [];
      const r = w.voegStateSamen(mkState(), nu);
      return r.rapport.facturen === 1 && r.state.facturen.invoices.length === 1;
    }],
    ['Merge: raakt de invoer niet aan',     () => {
      const oud = mkState(), nu = zonderNotitie();
      const voor = JSON.stringify([oud, nu]);
      w.voegStateSamen(oud, nu);
      return JSON.stringify([oud, nu]) === voor;
    }],
    ['Merge: gelijke states geven leeg rapport', () => {
      const r = w.voegStateSamen(mkState(), mkState());
      return w.versieRapportTekst(r.rapport) === null;
    }],
    ['versieTelling: mappen tellen niet mee', () => {
      const t = w.versieTelling(mkState());
      return t.notities === 2 && t.uren === 3 && t.facturen === 1 && t.klanten === 2;
    }],

    /* ── Vastpinnen ──
       Twee eisen: vastgepind staat bovenaan, en onderling verandert er niets
       aan de volgorde. Beide tests zijn onafhankelijk van de gekozen
       sorteermodus, zodat ze niet omvallen door wat er in Drive staat. */
    ['Pin: vastgepind gaat voor de rest', () =>
      w.clVastCmp({pinned:true}, {}) < 0 &&
      w.clVastCmp({}, {pinned:true}) > 0 &&
      w.clVastCmp({pinned:true}, {pinned:true}) === 0 &&
      w.clVastCmp({}, {}) === 0],
    ['Pin: sortering zet vastgepind bovenaan', () => {
      const cmp = w.clSortCmp();
      const lijst = [
        {id:'a', text:'Aaa', createdAt:3, sortOrder:1, deadline:'2026-01-01'},
        {id:'b', text:'Zzz', createdAt:1, sortOrder:9, deadline:'2026-12-31', pinned:true},
        {id:'c', text:'Mmm', createdAt:2, sortOrder:5, deadline:'2026-06-15'}
      ];
      return lijst.slice().sort(cmp).map(i => i.id)[0] === 'b';
    }],
    ['Pin: onderling geldt de gewone volgorde', () => {
      const cmp = w.clSortCmp();
      const p1 = {id:'p1', text:'Alfa', createdAt:1, sortOrder:1, deadline:'2026-01-01'};
      const p2 = {id:'p2', text:'Beta', createdAt:2, sortOrder:2, deadline:'2026-02-01'};
      const zonder = Math.sign(cmp(p1, p2));
      const met    = Math.sign(cmp({...p1, pinned:true}, {...p2, pinned:true}));
      return zonder !== 0 && zonder === met;
    }],

    ['No iframe console errors',           () => iframeErrors.length === 0]
  ];

  let pass = 0, fail = 0;
  checks.innerHTML = tests.map(([name, fn]) => {
    let ok=false, err='';
    try { ok = !!fn(); } catch(e){ err = ' — ' + e.message; }
    if (ok) pass++; else fail++;
    return `<div class="check ${ok?'ok':'fail'}">${ok?'✓':'✗'} ${name}${err}</div>`;
  }).join('');

  if (iframeErrors.length) {
    checks.innerHTML += '<div class="check warn">⚠ Console errors:</div>' +
      iframeErrors.map(e => `<div class="check warn">  ${e}</div>`).join('');
  }

  summary.innerHTML = `<div class="summary ${fail===0?'allgreen':'hasfail'}">${pass}/${tests.length} passed${fail?` · ${fail} FAILED`:''}</div>`;
}
</script>
</body>
</html>
