<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herling Analytics</title>
<style>html,body{margin:0;background:#0A1330}</style>
</head>
<body>
<script>
/* Terugkeerpagina voor stil vernieuwen (googleStilToken in index.html).
   Google stuurt hierheen met het token achter de #. De app leest het uit
   het onzichtbare frame en haalt het frame weg. Wordt deze pagina los
   geopend, dan gaat de # meteen uit de adresbalk en ga je naar de app. */
if (window.top === window) {
  history.replaceState(null, '', location.pathname);
  location.replace('./');
}
</script>
</body>
</html>
