# GitHub Pages bouwt deze site met Jekyll, en zet standaard alles uit de
# repo online. Dit houdt documentatie, tests en hulpscripts van de live site
# af (2026-10-11): daarin staat hoe de app en de gebruiker werken, en dat
# hoort niet op app.herling-analytics.nl. In de repo zelf staan ze nog wel.
# Mappen en bestanden die met een punt of een liggend streepje beginnen
# (.claude, .githooks, _meet-*.html) laat Jekyll al uit zichzelf weg.
exclude:
  - CLAUDE.md
  - docs/
  - test.html
  - validate.mjs
  - parallel-check.mjs
  - parallel-check.test.mjs
